<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Мой ритм</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: слева навигация (на телефоне снизу), в центре день/неделя, справа настроение и прогресс */
:root{
  --bg:#FFFFFF;color-scheme:light; --surface:#FFFFFF; --surface2:#F8F5FF; --ink:#2B2540; --muted:#7D7596; --line:#E8E1F7;
  --accent:#7A5AF8; --accent2:#B79BFF; --accent-ink:#fff; --soft:#EFE9FF; --soft2:#F6F2FF;
  --good:#3FA882; --warn:#E5A23B; --bad:#D6577A;
  --c-study:#7A5AF8; --c-tutor:#D45FA8; --c-work:#E58A3C; --c-home:#3FA67A; --c-me:#3E9BD6; --c-rest:#1FA5A0;
  --shadow:0 8px 26px rgba(110,77,242,.09);
  --font-d:'Unbounded','Onest',system-ui,sans-serif; --font-b:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --glow1:rgba(183,155,255,.24); --glow2:rgba(122,90,248,.10);
}
 *{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;
  padding-block:18px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(520px 420px at 8% -5%,var(--glow1),transparent 70%),
  radial-gradient(600px 480px at 100% 10%,var(--glow2),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px}
h1,h2,h3{font-family:var(--font-d);font-weight:500;margin:0;text-wrap:balance}

/* nav */
.nav{position:sticky;top:18px;align-self:start;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--font-d);font-size:20px;font-weight:600;margin:4px 0 18px 10px;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent))}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;color:var(--muted);font-weight:500;text-align:left}
.nav button svg{width:22px;height:22px;flex:none}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav .sp{flex:1}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .brand,.nav .sp{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;justify-content:space-around;gap:0;z-index:20;
    background:var(--surface);border-top:1px solid var(--line);
    padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav button{flex-direction:column;justify-content:center;gap:4px;padding:8px 2px;font-size:11px;line-height:1.1;border-radius:14px;flex:1 1 0;min-width:0;align-items:center;white-space:nowrap}
  .nav button svg{width:22px;height:22px}
  .nav button[aria-current="page"]{box-shadow:none;background:var(--soft)}
}
main{min-width:0}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
@media (max-width:1000px){.cols{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{padding:11px 18px;border-radius:999px;background:var(--soft);font-weight:600;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,#9C7DFF,#6E4DF2);color:#fff;box-shadow:0 8px 20px rgba(110,77,242,.3)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--soft);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.muted{color:var(--muted)}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;background:var(--surface2);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px}
textarea{resize:vertical;min-height:80px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}

/* head */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:clamp(22px,4.5vw,32px);line-height:1.15}
.head p{margin:6px 0 0;color:var(--muted)}
.dayswitch{display:flex;gap:6px;align-items:center}
.dayswitch button{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow);font-size:18px}
.dayswitch .today{width:auto;padding:0 18px;font-weight:600;font-size:14px;border-radius:999px}
.preview:empty{display:none}

/* quick add */
.qa input{font-size:16px;padding:15px 18px;border-radius:20px}
.qa .hint{font-size:13px;margin-top:8px}
.qg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.qg .lbl{font-size:12px;font-weight:600;color:var(--muted);min-width:64px}
.qc{padding:7px 13px;border-radius:999px;background:var(--soft2);font-size:13px;font-weight:600;transition:transform .12s}
.qc:active{transform:scale(.95)}
.qc.tpl{background:var(--soft);display:inline-flex;gap:8px;align-items:center;padding-right:8px}
.qc.tpl .x{opacity:.45;padding:0 4px;font-size:15px;line-height:1}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cats button{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;border:1.5px solid var(--line);color:var(--muted)}
.cats button[aria-pressed="true"]{border-color:currentColor;background:var(--surface2)}
.preview{display:flex;gap:6px;flex-wrap:wrap;min-height:26px;margin-top:10px}

/* now */
.now{background:linear-gradient(135deg,var(--soft2),var(--soft));border-radius:24px;padding:20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.now h2{font-size:18px;margin:4px 0 2px;line-height:1.25}
.now .grow{min-width:200px}

/* tasks */
.tl{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-radius:18px;background:var(--surface2);border:1px solid transparent}
.task:hover{border-color:var(--line)}
.task .time{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;min-width:48px;color:var(--muted)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--surface);transition:all .2s}
.check svg{width:14px;height:14px;opacity:0;stroke:#fff}
.done .check{background:var(--good);border-color:var(--good)}
.done .check svg{opacity:1}
.done .tt{text-decoration:line-through;color:var(--muted)}
.tt{font-weight:600;overflow-wrap:anywhere;text-align:left;display:block}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px;align-items:center}
.prio3{box-shadow:inset 3px 0 0 var(--accent)}
.warnchip{background:#FFF0D6;color:#8A5A00}
.banner{padding:12px 14px;border-radius:16px;background:var(--soft2);border:1px solid var(--line);margin-top:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.banner span{flex:1 1 200px;min-width:0}
.fbar{position:relative;height:18px;border-radius:99px;background:var(--soft);overflow:hidden;margin:14px 0 6px}
.fbar i{position:absolute;top:0;bottom:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.grid3 input{padding:10px 8px;border-radius:14px;font-size:14px}
.grid3 label{font-size:11px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.tact{display:flex;gap:6px;align-items:center}
.xdel{width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:22px;line-height:1;display:grid;place-items:center;flex:none}
.xdel:hover{background:var(--soft);color:var(--bad)}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:inset 0 0 0 2px #fff}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.joygrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:16px}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;background:var(--surface2);overflow-wrap:anywhere}
.li .x{opacity:.5;padding:2px 8px;font-size:18px;line-height:1}
.big{font-family:var(--font-d);font-size:28px;line-height:1.1}
.mdots{display:flex;gap:6px;margin-top:10px}
.mdots i{flex:1;height:8px;border-radius:99px;background:var(--line)}
.group-title{margin:18px 0 0;font-size:13px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}

/* ring */
.ringbox{display:flex;align-items:center;gap:16px}
.ring{position:relative;width:104px;height:104px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-d);font-size:20px}
.moods{display:flex;gap:6px}
.moods button{flex:1;padding:10px 0;border-radius:14px;font-size:22px;background:var(--surface2);border:1.5px solid transparent}
.moods button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.energy button{flex:1;padding:9px 6px;border-radius:14px;background:var(--surface2);font-size:13px;font-weight:600;border:1.5px solid transparent}
.energy button[aria-pressed="true"]{border-color:var(--accent2);background:var(--soft2)}

/* week */
.week{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.day{padding:16px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.day.is-today{outline:2px solid var(--accent)}
.day header{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day header button{font-weight:700;text-align:left}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.mini{display:flex;gap:8px;align-items:baseline;font-size:13px;padding:6px 8px;border-radius:10px;background:var(--surface2);min-width:0}
.mini span:last-child{overflow-wrap:anywhere}
.mini.done{opacity:.55;text-decoration:line-through}

/* habits */
.habit{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px;border-radius:20px;background:var(--surface2)}
.dots{display:flex;gap:4px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.dots i.today{outline:2px solid var(--accent);outline-offset:1px}

/* focus */
.timer{display:grid;place-items:center;gap:18px;padding:12px 0}
.tring{position:relative;width:min(300px,78vw);aspect-ratio:1}
.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring div{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.tring b{font-family:var(--font-d);font-size:clamp(38px,12vw,54px);font-variant-numeric:tabular-nums;font-weight:500}

/* notes */
.note{padding:14px;border-radius:18px;background:var(--surface2);display:flex;flex-direction:column;gap:10px;overflow-wrap:anywhere;white-space:pre-wrap}
.notes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:14px}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(30,20,60,.45);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:26px;padding:22px;width:min(460px,100%);max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:999px;z-index:60;font-weight:600;max-width:calc(100vw - 32px);text-align:center;box-shadow:var(--shadow)}
@media (min-width:861px){.toast{bottom:28px}}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-width:560px){
  .task{grid-template-columns:auto minmax(0,1fr)}
  .task>.btn,.task>.tact{grid-column:2;justify-self:start}
  .task>button[data-act="edit"]{flex-direction:column;gap:2px!important}
  .card h3.grow{flex:1 1 100%}
  .qa .cats{flex:1 1 100%}
  .qa .btn.primary{width:100%}
  .now .btn{flex:1 1 auto;white-space:nowrap}
  .now .btn.primary{flex-basis:100%}
}
@media (max-width:860px){.nav button{font-size:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="glow"></div>
<div class="app">

  <main id="main"></main>
</div>
<div id="layer"></div>

<script>
(function(){
'use strict';
/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d)};
const todayS=()=>fmt(new Date());
const toM=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fromM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const uid=()=>Math.random().toString(36).slice(2,9);
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const WDL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const longDate=s=>{const d=parseD(s);return WDL[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]};
const shortDate=s=>{const d=parseD(s);return d.getDate()+' '+MON[d.getMonth()]};
const durLabel=m=>m>=60?(m%60?Math.floor(m/60)+' ч '+(m%60)+' м':Math.floor(m/60)+' ч'):m+' м';
const CATS={study:{n:'Учёба',c:'var(--c-study)'},tutor:{n:'Репетиторство',c:'var(--c-tutor)'},work:{n:'Дела',c:'var(--c-work)'},home:{n:'Дом',c:'var(--c-home)'},me:{n:'Для себя',c:'var(--c-me)'},rest:{n:'Отдых',c:'var(--c-rest)'}};
const RESTS=[['Прогулка',30],['Чай и тишина',15],['Дневной сон',20],['Фильм или сериал',60],['Встреча с друзьями',90]];
const CATW={study:['учёба','учеба','учёбе','колледж','универ'],tutor:['репетиторство','репетитор','ученик','урок'],work:['дела','дело','работа'],home:['дом','домашнее','быт'],me:['я','себе','для-себя'],rest:['отдых','отдыхать','релакс']};
const KW={study:['учёба','учеба','колледж','универ','курсов','экзамен','лекци','пара','семинар','конспект','реферат','доклад','зачёт','зачет','статья','статью','диплом','сессия','домашка','дз'],
  tutor:['репетитор','ученик','урок','занятие','репетиторство'],
  work:['письмо','письма','встреча','созвон','отчёт','отчет','проект'],
  home:['уборка','убраться','магазин','продукты','готовить','стирка','посуда','квартира'],
  me:['спорт','зал','врач','стрижка','маникюр','дневник','йога'],
  rest:['прогулка','гулять','сериал','кино','игры','друзья','отдых','сон','релакс']};
const wordHit=(w,k)=>{const st=k.slice(0,Math.min(5,k.length));return w===k||(w.startsWith(st)&&(k.length>=5||w.length<=k.length+2))};
function detectCat(words){
  const tags=(S&&S.tags)||[];
  for(const raw of words){const w=raw.toLowerCase().replace(/[^а-яёa-z0-9-]/g,'');if(w.length<3)continue;
    for(const t of tags){const keys=(t.kw||[]).concat(t.n.toLowerCase().split(/\s+/).filter(x=>x.length>=3));if(keys.some(k=>wordHit(w,k)))return t.id}
    for(const k of Object.keys(KW)){if(KW[k].some(x=>wordHit(w,x)))return k}}
  return null;
}
const slug=n=>n.toLowerCase().replace(/\s+/g,'-');
const catByWord=w=>Object.keys(CATW).find(k=>CATW[k].includes(w))||((S&&S.tags||[]).find(t=>slug(t.n)===w)||{}).id;
const catWord=k=>CATW[k]?CATW[k][0]:slug(CATS[k].n);

/* ---------- состояние ---------- */
const KEY='ritm-v1';
let S=null, mem=null;
function load(){
  try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}
  return mem;
}
function save(){mem=S;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function seed(){
  const t=todayS(), y=addDays(t,-1), tm=addDays(t,1);
  const k=(title,cat,date,time,dur,prio)=>({id:uid(),title,cat,date,time,dur,prio,done:false,example:true});
  return {
    tasks:[],
    habits:[
      {id:uid(),name:'Стакан воды утром'},
      {id:uid(),name:'Повторить французский, 10 минут'},
      {id:uid(),name:'Прогулка без телефона'},
      {id:uid(),name:'Лечь спать до 00:00'}
    ],
    hlog:{}, mood:{}, notes:[], focus:{}, lastCat:'study', examples:true,
    tpl:[{id:uid(),text:'Подготовить урок 60м #репетиторство'},{id:uid(),text:'Учёба 1ч #учёба'},{id:uid(),text:'Уборка 30м #дом'},{id:uid(),text:'Прогулка 30м #отдых'}]
  };
}
S=load()||seed(); if(!S.tpl)S.tpl=seed().tpl; let flt='all', tagColor='#7A5AF8', lastDel=null, qOpen=false, bulk=false, showRest=false, skipN=0; if(S.soft===undefined)S.soft=true; if(!S.heavy)S.heavy={};
if(!S.why)S.why=[]; if(!S.doneDays)S.doneDays={}; if(S.wins===undefined)S.wins=S.tasks.filter(t=>t.done).length;
if(!S.reward)S.reward={text:'',goal:10};
if(!S.joy)S.joy=['Любимый плейлист и чай','Позвонить подруге','Тёплый душ и пижама','Посмотреть серию с вкусняшкой'].map(t=>({id:uid(),text:t}));

const DAYRX=[[1,/^(пн|понедельник\w*)$/],[2,/^(вт|вторник\w*)$/],[3,/^(ср|сред[ауы])$/],[4,/^(чт|четверг\w*)$/],[5,/^(пт|пятниц[ауы])$/],[6,/^(сб|суббот[ауы])$/],[0,/^(вс|воскресень[ея])$/]];
function parseQuick(raw){
  const out={title:'',date:undefined,time:null,dur:null,prio:2,cat:null};
  const words=raw.trim().split(/\s+/).filter(Boolean);
  const used=new Array(words.length).fill(false);
  const base=sel;
  for(let i=0;i<words.length;i++){
    const w=words[i].toLowerCase().replace(/[,;]+$/,'');
    let m;
    if(w[0]==='#'){const k=catByWord(w.slice(1));if(k){out.cat=k;used[i]=true}continue}
    if(/^!+$/.test(w)||w==='срочно'||w==='важно'){out.prio=3;used[i]=true;continue}
    if(w==='потом'||w==='когда-нибудь'){out.date=null;used[i]=true;continue}
    if(w==='сегодня'){out.date=todayS();used[i]=true;continue}
    if(w==='завтра'){out.date=addDays(todayS(),1);used[i]=true;continue}
    if(w==='послезавтра'){out.date=addDays(todayS(),2);used[i]=true;continue}
    const dr=DAYRX.find(x=>x[1].test(w));
    if(dr&&i>0&&['в','во','на','к'].includes(words[i-1].toLowerCase())||dr&&words.length===1){
      const cur=parseD(todayS()).getDay();let diff=(dr[0]-cur+7)%7;if(diff===0)diff=7;
      out.date=addDays(todayS(),diff);used[i]=true;if(i>0)used[i-1]=true;continue}
    if((m=w.match(/^(\d{1,2})\.(\d{1,2})$/))&&+m[1]<=31&&+m[2]<=12){
      const now=new Date();let y=now.getFullYear();let d=new Date(y,+m[2]-1,+m[1]);
      if(fmt(d)<todayS())d=new Date(y+1,+m[2]-1,+m[1]);out.date=fmt(d);used[i]=true;continue}
    if((m=w.match(/^(\d{1,2}):(\d{2})$/))&&+m[1]<24&&+m[2]<60){out.time=pad(+m[1])+':'+m[2];used[i]=true;if(i>0&&['в','к'].includes(words[i-1].toLowerCase()))used[i-1]=true;continue}
    if(i>0&&['в','к'].includes(words[i-1].toLowerCase())&&(m=w.match(/^(\d{1,2})$/))&&+m[1]<24){out.time=pad(+m[1])+':00';used[i]=true;used[i-1]=true;continue}
    if((m=w.match(/^(\d+)(м|мин|минут)$/))){out.dur=+m[1];used[i]=true;continue}
    if((m=w.match(/^(\d+(?:[.,]\d+)?)(ч|час|часа|часов)$/))){out.dur=Math.round(parseFloat(m[1].replace(',','.'))*60);used[i]=true;continue}
    if(w==='полчаса'){out.dur=30;used[i]=true;continue}
    if(w==='час'){out.dur=60;used[i]=true;continue}
  }
  if(!out.cat)out.cat=detectCat(words.filter((_,i)=>!used[i]));
  out.title=words.filter((_,i)=>!used[i]).join(' ').replace(/\s+/g,' ').trim();
  if(out.title)out.title=out.title[0].toUpperCase()+out.title.slice(1);
  if(out.date===undefined)out.date=base;
  if(!out.dur)out.dur=out.time?60:30;
  return out;
}

function autoPlan(day){
  const isToday=day===todayS();
  const start=Math.max(toM(S.day.from),isToday?Math.ceil(nowM()/15)*15:0), end=Math.min(toM(S.day.to),22*60+30);
  const busy=dayTasks(day).filter(t=>t.time&&!t.done).map(t=>[toM(t.time),toM(t.time)+t.dur]).sort((a,b)=>a[0]-b[0]);
  schBlocks(day).forEach(x=>busy.push([x.a,x.b]));busy.sort((a,b)=>a[0]-b[0]);const low=mood(day).energy===1;
  const todo=dayTasks(day).filter(t=>!t.time&&!t.done).sort((a,b)=>low?(a.dur-b.dur||b.prio-a.prio):(b.prio-a.prio||b.dur-a.dur));
  let placed=0,left=0;

    if(c+t.dur<=end){t.time=fromM(c);busy.push([c,c+t.dur]);busy.sort((a,b)=>a[0]-b[0]);placed++}else left++;

}

function pickNow(){

}

function freeInfo(day){

  const sim=all.filter(t=>t.time).map(t=>[toM(t.time),toM(t.time)+t.dur]).filter(b=>b[1]>start&&b[0]<to).map(clip).sort((a,b)=>a[0]-b[0]);

function normV(s){s=s.replace(/\s+/g,' ').trim();

  s=s.replace(/(\d{1,2})(?::(\d{2}))?\s*(вечера|дня|утра|ночи)/gi,(m,h,mi,pp)=>{h=+h;pp=pp.toLowerCase();if((pp==='вечера'||pp==='дня')&&h<12)h+=12;return h+':'+(mi||'00')});
  return s.replace(/полтора часа/gi,'90м').replace(/(\d+)\s*(?:минут\w*|мин)(?=\s|$|,|\.)/gi,'$1м').replace(/(\d+(?:[.,]\d+)?)\s*(?:часа|часов|час|ч)(?=\s|$|,|\.)/gi,'$1ч')}

    Object.keys(DW).forEach(k=>{if(new RegExp('(^|\\s)'+k).test(t.toLowerCase()))ds.push(DW[k])});ds=[...new Set(ds)];if(!ds.length)ds=[1,2,3,4,5];
    const a=pad(+m[1])+':'+(m[2]||'00'),b=pad(+m[3])+':'+(m[4]||'00');ds.forEach(d=>S.sch.days[d]=[a,b]);save();toast('Пары записала: '+a+'–'+b+' ('+ds.map(d=>WD[d]).join(', ')+')');return}

    <button class="btn" style="width:100%" data-act="joypick">Удиви меня</button>
    <div class="row" style="margin:12px 0"><input type="text" id="joy-in" class="grow" style="flex:1 1 160px" placeholder="Что тебя радует" aria-label="Радость"><button class="btn primary" data-act="joyadd">Добавить</button></div>
    <div class="stack" style="gap:8px">${S.joy.map(j=>`<div class="li"><span>${esc(j.text)}</span><button class="x" data-act="joydel" data-id="${j.id}" aria-label="Удалить">×</button></div>`).join('')}</div></section>
  </div>`;
}
function render(){
  renderNav();
  $('#main').innerHTML={day:vDay,week:vWeek,sch:vSchedule,habits:vHabits,focus:vFocus,notes:vNotes,joy:vJoy}[view]();
  if(view==='day'){updatePreview();}
}

/* ---------- вспомогательное UI ---------- */
let toastT;
function toast(msg,undo){
  const old=$('.toast');if(old)old.remove();
  const d=document.createElement('div');d.className='toast fade';d.textContent=msg;d.setAttribute('role','status');
  if(undo){const b=document.createElement('button');b.dataset.act='undo';b.textContent='Вернуть';b.style.cssText='margin-left:14px;font-weight:700;text-decoration:underline;color:inherit';d.appendChild(b)}
  document.body.appendChild(d);
  clearTimeout(toastT);toastT=setTimeout(()=>d.remove(),undo?5500:3200);
}
function updatePreview(){
  const el=$('#qa'),pv=$('#pv');if(!el||!pv)return;
  const v=el.value.trim();if(!v){pv.innerHTML='';return}
  const p=parseQuick(v);
  pv.innerHTML=(p.title?'':'<span class="chip muted">нужно название</span>')+
    `<span class="chip">${p.date?(p.date===todayS()?'сегодня':shortDate(p.date)):'в копилку'}</span>`+
    (p.time?`<span class="chip">${p.time}</span>`:'')+`<span class="chip">${durLabel(p.dur)}</span>`+
    (p.prio===3?'<span class="chip" style="color:var(--accent)">важно</span>':'')+catChip(p.cat||curCat);
}
function addFromQuick(){
  const el=$('#qa');if(!el)return;
  const p=parseQuick(el.value);if(!p.title){toast('Напиши, что нужно сделать');el.focus();return}
  S.tasks.push({id:uid(),title:p.title,cat:p.cat||curCat,date:p.date,time:p.time,dur:p.dur,prio:p.prio,done:false});
  save();render();toast(p.date?'Добавлено на '+(p.date===todayS()?'сегодня':shortDate(p.date)):'Убрала в копилку');
  const q=$('#qa');if(q)q.focus();
}
function openModal(id){
  const t=S.tasks.find(x=>x.id===id);if(!t)return;
  $('#layer').innerHTML=`<div class="scrim" data-act="closeModal"><form class="modal" id="mf" data-id="${t.id}">
    <h3 style="font-size:18px">Дело</h3>
    <label>Название<input type="text" id="m-title" value="${esc(t.title)}"></label>
    <div class="grid2"><label>Дата<input type="date" id="m-date" value="${t.date||''}"></label><label>Время<input type="time" id="m-time" value="${t.time||''}"></label></div>
    <div class="grid2"><label>Минут<input type="number" id="m-dur" min="5" step="5" value="${t.dur}"></label>
    <label>Важность<select id="m-prio"><option value="1" ${t.prio===1?'selected':''}>Обычное</option><option value="2" ${t.prio===2?'selected':''}>Нужное</option><option value="3" ${t.prio===3?'selected':''}>Важное</option></select></label></div>
    <label>Сфера<select id="m-cat">${Object.keys(CATS).map(k=>`<option value="${k}" ${t.cat===k?'selected':''}>${CATS[k].n}</option>`).join('')}</select></label>
    <div class="row" style="justify-content:space-between;margin-top:4px"><button type="button" class="btn ghost" data-act="del" data-id="${t.id}" style="color:var(--bad)">Удалить</button>
    <div class="row"><button type="button" class="btn" data-act="closeModal">Отмена</button><button type="submit" class="btn primary">Сохранить</button></div></div></form></div>`;
  $('#m-title').focus();
}
const closeModal=()=>{$('#layer').innerHTML=''};
const TCOL=['#7A5AF8','#D45FA8','#E58A3C','#3FA67A','#3E9BD6','#1FA5A0','#C9533F','#8A6D3B'];
function openTagModal(){
  $('#layer').innerHTML=`<div class="scrim" data-act="closeModal"><div class="modal">
    <h3 style="font-size:18px">Свои теги</h3>
    <label>Название<input type="text" id="tg-n" maxlength="20" placeholder="Например: курсовая" autocomplete="off"></label>
    <label>Слова-подсказки, через запятую<input type="text" id="tg-k" placeholder="курсовая, глава, антиплагиат" autocomplete="off"></label>
    <div class="swatches" role="group" aria-label="Цвет тега">${TCOL.map(c=>`<button type="button" class="sw" data-act="tagcol" data-c="${c}" style="background:${c}" aria-pressed="${tagColor===c}" aria-label="Цвет ${c}"></button>`).join('')}</div>
    <button type="button" class="btn primary" data-act="tagadd">Создать тег</button>
    ${S.tags.length?`<div class="eyebrow" style="margin-top:6px">Твои теги</div><div class="stack" style="gap:8px">${S.tags.map(t=>`<div class="li"><span><span class="chip" style="color:${t.c}"><span class="dot"></span>${esc(t.n)}</span> <span class="muted" style="font-size:12px">${esc((t.kw||[]).join(', '))}</span></span><button class="x" data-act="tagdel" data-id="${t.id}" aria-label="Удалить тег">×</button></div>`).join('')}</div>`:''}
    <button type="button" class="btn" data-act="closeModal">Закрыть</button></div></div>`;
  const i=$('#tg-n');if(i)i.focus();
}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext;const c=new A();[0,.25,.5].forEach((d,i)=>{const o=c.createOscillator(),g=c.createGain();o.frequency.value=[660,784,988][i];g.gain.value=.12;o.connect(g);g.connect(c.destination);o.start(c.currentTime+d);o.stop(c.currentTime+d+.2)})}catch(e){}}

/* таймер */
setInterval(()=>{
  if(!T.running)return;
  T.left=Math.max(0,(T.end-Date.now())/1000);
  if(T.left<=0){
    T.running=false;
    if(T.mode==='focus'){S.focus[todayS()]=(S.focus[todayS()]||0)+Math.round(T.total/60);save();toast((S.focus[todayS()]||0)>=75?'Ты уже поработала '+durLabel(S.focus[todayS()])+'. Пора на нормальный отдых.':'Фокус завершён. Сделай перерыв.');T={mode:'break',total:300,left:300,end:null,running:false,taskId:T.taskId}}
    else{toast('Перерыв закончился');T={mode:'focus',total:25*60,left:25*60,end:null,running:false,taskId:T.taskId}}
    beep();if(view==='focus')render();return;
  }
  if(view==='focus'){const a=$('#tt'),c=$('#tc');if(a)a.textContent=fmtT(Math.ceil(T.left));if(c){const C=2*Math.PI*118;c.setAttribute('stroke-dashoffset',C*(1-T.left/T.total))}}
},250);

/* ---------- события ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  const task=id&&S.tasks.find(t=>t.id===id);
  switch(a){
    case 'nav':view=el.dataset.v;if(view==='week')weekStart=mondayOf(sel);render();window.scrollTo(0,0);break;
    case 'day':sel=+el.dataset.n===0?todayS():addDays(sel,+el.dataset.n);render();break;
    case 'wk':weekStart=+el.dataset.n===0?mondayOf(todayS()):addDays(weekStart,7*+el.dataset.n);render();break;
    case 'openday':sel=el.dataset.d;view='day';render();window.scrollTo(0,0);break;
    case 'cat':curCat=el.dataset.k;S.lastCat=curCat;save();
      document.querySelectorAll('#cats button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===curCat));updatePreview();break;
    case 'add':addFromQuick();break;
    case 'tok':{const q=$('#qa');if(q){q.value=(q.value.trim()+' '+el.dataset.t).trim();q.focus();updatePreview()}break}
    case 'tpl':{const x=S.tpl.find(z=>z.id===id);if(x){const p=parseQuick(x.text);S.tasks.push({id:uid(),title:p.title,cat:p.cat||curCat,date:sel,time:null,dur:p.dur,prio:p.prio,done:false});save();render();toast('Добавлено: '+p.title)}break}
    case 'tpldel':S.tpl=S.tpl.filter(z=>z.id!==id);save();render();break;
    case 'tplsave':{const q=$('#qa');const p=parseQuick(q?q.value:'');if(!p.title){toast('Сначала напиши дело');break}
      S.tpl.push({id:uid(),text:p.title+' '+p.dur+'м #'+catWord(p.cat||curCat)});save();render();toast('Сохранила в частые');break}
    case 'funadd':{const i=$('#fun-in'),v=i.value.trim();if(!v){i.focus();break}S.fun.push({id:uid(),name:v});save();render();break}
    case 'fundel':S.fun=S.fun.filter(x=>x.id!==id);save();render();break;
    case 'funplan':{const fi=freeInfo(sel),f=funPlan(fi)[+el.dataset.i];if(!f)break;
      const w=fi.windows.find(w=>w[1]-w[0]>=f.min);if(!w){toast('Нет окна на '+durLabel(f.min)+'. Попробуй короче');break}
      S.tasks.push({id:uid(),title:f.name,cat:'rest',date:sel,time:fromM(w[0]),dur:f.min,prio:1,done:false});save();render();toast(f.name+' поставила на '+fromM(w[0]));break}
    case 'scok':{S.sch.days={};Object.keys(SC.days).forEach(d=>{S.sch.days[d]=[SC.days[d].from,SC.days[d].to]});SC=null;save();render();toast('Расписание заполнено');break}
    case 'sctxt':{const DW={пн:1,вт:2,ср:3,чт:4,пт:5,сб:6,вс:0},d={};($('#sc-txt').value||'').split('\n').forEach(l=>{const w=DW[l.trim().slice(0,2).toLowerCase()],m=l.match(/(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/);if(w!==undefined&&m)d[w]=[pad(+m[1])+':'+m[2],pad(+m[3])+':'+m[4]]});
      if(!Object.keys(d).length){toast('Не нашла строк вида «Пн 9:00-14:30»');break}S.sch.days=d;save();render();toast('Расписание заполнено');break}
    case 'scno':SC=null;render();break;
    case 'voice':voice();break;
    case 'vparse':{const q=$('#qa');if(q&&q.value.trim()){draftFromVoice(q.value);q.value='';render()}else toast('Сначала надиктуй или напиши дела в строку');break}
    case 'vdel':VD.splice(+el.dataset.i,1);if(!VD.length)VD=null;render();break;
    case 'vno':VD=null;render();break;
    case 'vok':{const ds=new Set();VD.forEach(p=>{S.tasks.push({id:uid(),title:p.title,cat:p.cat||curCat,date:p.date,time:p.time,dur:p.dur,prio:p.prio,done:false});if(p.date)ds.add(p.date)});
      const n=VD.length;VD=null;ds.forEach(d=>autoPlan(d));save();render();toast('Добавила и разложила по свободному времени: '+n);break}
    case 'schcopy':{const a=S.sch.days[1];if(a){[2,3,4,5].forEach(d=>S.sch.days[d]=a.slice());save();render();toast('Будни как в понедельник')}else toast('Сначала заполни понедельник');break}
    case 'remtog':S.sch.rem=!S.sch.rem;save();render();break;
    case 'notif':if('Notification' in window)Notification.requestPermission().then(r=>toast(r==='granted'?'Уведомления включены':'Уведомления не разрешены'));else toast('Этот браузер не поддерживает уведомления');break;
    case 'bulk':bulk=!bulk;render();break;
    case 'qmore':qOpen=!qOpen;render();break;
    case 'more':showRest=!showRest;render();break;
    case 'soft':S.soft=!(S.soft!==false);save();render();break;
    case 'heavy':S.heavy[sel]=!S.heavy[sel];if(S.heavy[sel])S.mood[sel]=Object.assign({},mood(sel),{energy:1});save();render();break;
    case 'other':skipN++;render();break;
    case 'release':{const o=overdue();o.forEach(t=>{t.date=null;t.time=null});save();render();toast('Убрала в копилку: '+o.length);break}
    case 'trim':{let l=dayTasks(sel).filter(t=>!t.done&&!t.time).sort((a,b)=>a.prio-b.prio||b.dur-a.dur),sum=dayTasks(sel).filter(t=>!t.done).reduce((x,t)=>x+t.dur,0),n=0;
      for(const t of l){if(sum<=360)break;t.date=addDays(sel,1);sum-=t.dur;n++}save();render();toast(n?'Перенесла на завтра: '+n:'Переносить нечего, остальное с фиксированным временем');break}
    case 'five':T={mode:'focus',total:300,left:300,end:Date.now()+300000,running:true,taskId:id};view='focus';render();window.scrollTo(0,0);toast('Всего пять минут. Потом можно остановиться.');break;
    case 'rest':{const r=RESTS[+el.dataset.i];S.tasks.push({id:uid(),title:r[0],cat:'rest',date:sel,time:null,dur:r[1],prio:1,done:false});save();render();toast('Добавила отдых: '+r[0]);break}
    case 'bulkadd':{const lines=($('#bulk').value||'').split('\n').map(x=>x.trim()).filter(Boolean);let n=0;
      lines.forEach(l=>{const p=parseQuick(l);if(p.title){S.tasks.push({id:uid(),title:p.title,cat:p.cat||curCat,date:p.date,time:p.time,dur:p.dur,prio:p.prio,done:false});n++}});
      if(!n){toast('Список пустой');break}bulk=false;save();render();toast('Добавлено дел: '+n);break}
    case 'toggle':if(task){task.done=!task.done;const dl=task.done?1:-1,b4=stageOf(S.wins||0);
      S.wins=Math.max(0,(S.wins||0)+dl);S.doneDays[todayS()]=Math.max(0,(S.doneDays[todayS()]||0)+dl);const af=stageOf(S.wins);
      save();render();if(task.done){confetti(e);toast(af>b4?'Твой росток вырос: '+STAGES[af][1]:CHEERS[Math.floor(Math.random()*CHEERS.length)])}}break;
    case 'whyadd':{const i=$('#why-in'),v=i.value.trim();if(!v){i.focus();break}S.why.push({id:uid(),text:v});save();render();break}
    case 'whydel':S.why=S.why.filter(x=>x.id!==id);save();render();break;
    case 'evadd':{const n=$('#ev-n').value.trim(),d=$('#ev-d').value;if(!n||!d){toast('Нужны название и дата');break}S.events.push({id:uid(),name:n,date:d});save();render();break}
    case 'evdel':S.events=S.events.filter(x=>x.id!==id);save();render();break;
    case 'joyadd':{const i=$('#joy-in'),v=i.value.trim();if(!v){i.focus();break}S.joy.push({id:uid(),text:v});save();render();break}
    case 'joydel':S.joy=S.joy.filter(x=>x.id!==id);save();render();break;
    case 'joypick':if(S.joy.length){joyShown=S.joy[Math.floor(Math.random()*S.joy.length)].text;render()}else toast('Сначала добавь что-нибудь приятное');break;
    case 'edit':openModal(id);break;
    case 'closeModal':if(el.classList.contains('scrim')&&e.target!==el)break;closeModal();break;
    case 'del':lastDel=task||null;S.tasks=S.tasks.filter(t=>t.id!==id);save();closeModal();render();toast('Дело удалено',!!lastDel);break;
    case 'undo':if(lastDel){S.tasks.push(lastDel);lastDel=null;save();render();const tt=$('.toast');if(tt)tt.remove()}break;
    case 'flt':flt=el.dataset.k;render();break;
    case 'tagmodal':openTagModal();break;
    case 'tagcol':tagColor=el.dataset.c;document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===tagColor));break;
    case 'tagadd':{const n=$('#tg-n').value.trim();if(!n){toast('Напиши название тега');$('#tg-n').focus();break}
      if(Object.keys(CATS).some(k=>CATS[k].n.toLowerCase()===n.toLowerCase())){toast('Такой тег уже есть');break}
      const t={id:'t_'+uid(),n,c:tagColor,kw:(($('#tg-k')||{}).value||'').toLowerCase().split(/[,;\s]+/).filter(x=>x.length>=3)};S.tags.push(t);CATS[t.id]={n:t.n,c:t.c};curCat=t.id;S.lastCat=t.id;save();closeModal();render();toast('Тег создан: '+n);break}
    case 'tagdel':{S.tags=S.tags.filter(t=>t.id!==id);delete CATS[id];S.tasks.forEach(t=>{if(t.cat===id)t.cat='work'});if(curCat===id)curCat='work';if(flt===id)flt='all';save();render();openTagModal();break}
    case 'toToday':if(task){task.date=todayS();save();render();toast('Перенесено на сегодня')}break;
    case 'plan':{const r=autoPlan(sel);render();const f=freeInfo(sel).total;
      toast((r.placed?`Расставила ${r.placed} дел${r.left?`, ${r.left} не влезло`:''}.`:(r.left?'Свободного времени не осталось.':'Нечего расставлять.'))+(f?' Свободно после дел: '+durLabel(f)+'.':''));break}
    case 'rollover':{const o=overdue();o.forEach(t=>{t.date=todayS();t.time=null});save();render();toast('Хвосты перенесены на сегодня: '+o.length);break}
    case 'mood':S.mood[sel]=Object.assign({},mood(sel),{mood:+el.dataset.v});save();render();break;
    case 'energy':S.mood[sel]=Object.assign({},mood(sel),{energy:+el.dataset.v});save();render();break;
    case 'habit':case 'habitToday':{const d=a==='habit'?sel:todayS();const l=S.hlog[d]||(S.hlog[d]=[]);const i=l.indexOf(id);i>=0?l.splice(i,1):l.push(id);save();render();break}
    case 'haddBtn':{const i=$('#hn');const v=i.value.trim();if(!v){i.focus();break}S.habits.push({id:uid(),name:v});save();render();break}
    case 'hdel':S.habits=S.habits.filter(h=>h.id!==id);save();render();break;
    case 'focusTask':T={mode:'focus',total:25*60,left:25*60,end:null,running:false,taskId:id};view='focus';render();window.scrollTo(0,0);break;
    case 'preset':{const m=+el.dataset.m;T={mode:el.dataset.b?'break':'focus',total:m*60,left:m*60,end:null,running:false,taskId:T.taskId};render();break}
    case 'tgo':if(T.running){T.running=false;T.left=Math.max(0,(T.end-Date.now())/1000)}else{T.end=Date.now()+T.left*1000;T.running=true}render();break;
    case 'treset':T.running=false;T.left=T.total;render();break;
    case 'nadd':{const i=$('#nt');const v=i.value.trim();if(!v){i.focus();break}S.notes.unshift({id:uid(),text:v});save();render();break}
    case 'ndel':S.notes=S.notes.filter(n=>n.id!==id);save();render();break;
    case 'n2t':{const n=S.notes.find(x=>x.id===id);if(n){S.tasks.push({id:uid(),title:n.text.split('\n')[0].slice(0,120),cat:curCat,date:todayS(),time:null,dur:30,prio:2,done:false});S.notes=S.notes.filter(x=>x.id!==id);save();render();toast('Заметка стала делом на сегодня')}break}
  }
});
document.addEventListener('input',e=>{if(e.target.id==='qa')updatePreview()});
document.addEventListener('change',e=>{const FW={'fw-from':'from','fw-to':'to','fw-res':'res'};
  if(FW[e.target.id]){S.day[FW[e.target.id]]=e.target.id==='fw-res'?Math.max(0,+e.target.value||0):(e.target.value||S.day[FW[e.target.id]]);save();render();return}
  if(e.target.id==='rw'){S.reward.text=e.target.value.trim();save()}
  if(e.target.id==='tsel')T.taskId=e.target.value||null});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='qa'){e.preventDefault();addFromQuick()}
  if(e.key==='Enter'&&e.target.id==='hn'){e.preventDefault();const b=document.querySelector('[data-act=haddBtn]');b&&b.click()}
  if(e.key==='Enter'){const m={'why-in':'whyadd','joy-in':'joyadd','tg-n':'tagadd','fun-in':'funadd'}[e.target.id];if(m){e.preventDefault();const b=document.querySelector('[data-act='+m+']');b&&b.click()}}
  if(e.key==='Escape')closeModal();
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='mf')return;e.preventDefault();
  const t=S.tasks.find(x=>x.id===e.target.dataset.id);if(!t)return;
  const title=$('#m-title').value.trim();if(!title){toast('Название не может быть пустым');return}
  t.title=title;t.date=$('#m-date').value||null;t.time=$('#m-time').value||null;t.dur=Math.max(5,+$('#m-dur').value||30);t.prio=+$('#m-prio').value;t.cat=$('#m-cat').value;
  save();closeModal();render();
});
render();
})();
</script>
