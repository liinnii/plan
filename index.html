<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}.ttd{border:1px solid var(--line);border-radius:20px;padding:14px;background:var(--surface);display:flex;flex-direction:column;gap:8px;min-width:0}
.ttd.today{border-color:var(--accent)}
.ttl{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:8px;align-items:center;padding:10px;border-radius:14px;background:var(--surface2)}
.ttl .n{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:700;display:grid;place-items:center;font-size:13px}
.ttl .f{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.ttl .f input{padding:8px 10px;font-size:14px;border-radius:12px;min-width:0}
.fcard{min-height:150px;display:grid;place-items:center;text-align:center;padding:24px;border-radius:24px;background:var(--soft2);border:1.5px solid var(--line);font-size:18px;font-weight:600;width:100%;cursor:pointer}.qopt{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface2)}.qopt.ok{border-color:var(--good);background:#E8F6F0}.qopt.no{border-color:var(--warn);background:#FFF4E0}
</style></head><body>

<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Мой ритм"><meta name="application-name" content="Мой ритм"><meta name="theme-color" content="#7A5AF8">
<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: слева навигация (на телефоне снизу), в центре день/неделя, справа настроение и прогресс */
:root{
  --bg:#FFFFFF;color-scheme:light; --surface:#FFFFFF; --surface2:#F8F5FF; --ink:#2B2540; --muted:#7D7596; --line:#E8E1F7;
  --accent:#7A5AF8; --accent2:#B79BFF; --accent-ink:#fff; --soft:#EFE9FF; --soft2:#F6F2FF;
  --good:#3FA882; --warn:#E5A23B; --bad:#D6577A;
  --c-study:#7A5AF8; --c-tutor:#D45FA8; --c-work:#E58A3C; --c-home:#3FA67A; --c-me:#3E9BD6; --c-rest:#1FA5A0;
  --shadow:0 8px 26px rgba(110,77,242,.09);
  --font-d:'Unbounded','Onest',system-ui,sans-serif; --font-b:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --glow1:rgba(183,155,255,.24); --glow2:rgba(122,90,248,.10);
}
 *{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.45;
  padding-block:18px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(520px 420px at 8% -5%,var(--glow1),transparent 70%),
  radial-gradient(600px 480px at 100% 10%,var(--glow2),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.app{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px}
h1,h2,h3{font-family:var(--font-d);font-weight:500;margin:0;text-wrap:balance}

/* nav */
.nav{position:sticky;top:18px;align-self:start;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--font-d);font-size:20px;font-weight:600;margin:4px 0 18px 10px;display:flex;align-items:center;gap:8px}
.brand i{width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,var(--accent2),var(--accent))}
.nav button{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;color:var(--muted);font-weight:500;text-align:left}
.nav button svg{width:22px;height:22px;flex:none}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.nav button[aria-current="page"] svg{color:var(--accent)}
.nav .sp{flex:1}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .brand,.nav .sp{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;top:auto;flex-direction:row;justify-content:space-around;gap:0;z-index:20;
    background:var(--surface);border-top:1px solid var(--line);
    padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .nav button{flex-direction:column;justify-content:center;gap:4px;padding:8px 2px;font-size:11px;line-height:1.1;border-radius:14px;flex:1 1 0;min-width:0;align-items:center;white-space:nowrap}
  .nav button svg{width:22px;height:22px}
  .nav button[aria-current="page"]{box-shadow:none;background:var(--soft)}
  .nav button.nx{display:none}
}
.nav button.nm{display:none}
@media (max-width:860px){.nav button.nm{display:flex}}
.navsheet{position:fixed;inset:0;z-index:19;background:rgba(30,20,60,.35)}
.navsheet-p{position:absolute;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;background:var(--surface);border-radius:22px;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;box-shadow:0 12px 32px rgba(30,20,60,.25);animation:fade .18s ease}
.navsheet-p button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 4px;border-radius:16px;font-size:12px;font-weight:600;color:var(--ink);background:var(--soft2)}
.navsheet-p button svg{width:26px;height:26px;color:var(--accent)}
.navsheet-p button[aria-current="page"]{background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
@media (min-width:861px){.navsheet{display:none}}
main{min-width:0}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;border:1px solid var(--line)}
.fold-h{display:flex;align-items:center;gap:10px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
.fold-h h3.grow{flex:1 1 140px!important;min-width:0}
.fold-c{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--soft);color:var(--accent);display:grid;place-items:center;cursor:pointer;padding:0}
.fold-c svg{transition:transform .2s}
.card.folded .fold-c svg{transform:rotate(-90deg)}
.card.folded .fold-b{display:none}
.alf{position:relative;height:280px;border-radius:22px;background:var(--soft2);border:2px dashed var(--line);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.ac{display:flex;flex-direction:column;align-items:center;justify-content:center;width:76px;height:62px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 10px rgba(122,90,248,.12);user-select:none;-webkit-user-select:none;cursor:grab;color:var(--ink)}
.alf .ac{position:absolute;touch-action:none}
.ae{font-size:24px;line-height:1}
.an{font-size:11px;font-weight:600;margin-top:2px;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.als{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px;max-height:210px;overflow-y:auto;padding:4px}
.als .ac{touch-action:pan-y}
.ac.drag,.mc.drag{position:fixed!important;z-index:9999;pointer-events:none;opacity:.95;box-shadow:0 12px 24px rgba(0,0,0,.25);transform:scale(1.08);margin:0}
.ac.ghost0,.mc.src0{opacity:.25}
.ac.no{animation:acshake .4s}
.ac.nw{animation:pop .6s ease;border-color:var(--good)}
@keyframes acshake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mrb{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:360px;margin:12px auto 0;touch-action:none;user-select:none;-webkit-user-select:none}
.mc{aspect-ratio:1;border-radius:16px;background:var(--soft2);border:2px dashed var(--line);display:grid;place-items:center;font-size:clamp(26px,8vw,38px);user-select:none;-webkit-user-select:none;touch-action:none}
.mc.has{background:var(--surface);border:2px solid var(--line);box-shadow:0 4px 10px rgba(122,90,248,.12);cursor:grab}
.mc.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.mc.tgt{border-color:var(--good);background:var(--soft)}
.mc.pop{animation:pop .5s ease}
.cus{display:flex;gap:8px;max-width:380px;margin:10px auto 0}
.cu{flex:1 1 0;min-width:0;border-radius:16px;background:var(--surface);border:2px solid var(--line);padding:8px 4px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .15s}
.cu .ca{font-size:28px;line-height:1}
.cu .cn{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.cu .cw{margin:4px auto 0;width:44px;height:36px;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:22px}
.cu .cr{font-size:11px;color:var(--muted);margin-top:3px}
.cu.rdy{border-color:var(--good)}
.cu.tgt{border-color:var(--good);background:var(--soft);transform:scale(1.05)}
.mrfs{position:fixed;inset:0;z-index:40;background:var(--bg);display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:8px;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px);overscroll-behavior:contain}
.mrfs .cus{margin:0;width:100%;max-width:520px;justify-self:center}
.mrfs .cu{padding:5px 2px}
.mrfs .cu .ca{font-size:22px}
.mrfs .cu .cn{font-size:10px;margin-top:1px}
.mrfs .cu .cw{width:36px;height:28px;font-size:18px;margin-top:2px}
.mrfs .cu .cr{font-size:10px;margin-top:1px}
.mrfs-top{display:flex;align-items:center;gap:8px;max-width:520px;width:100%;justify-self:center}

<script>
(function(){
'use strict';
(function(){const a=document.querySelector('link[rel=apple-touch-icon]');if(a&&!document.querySelector('link[rel=icon]')){const l=document.createElement('link');l.rel='icon';l.type='image/png';l.href=a.href;document.head.appendChild(l)}try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}})();
/* ---------- утилиты ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d)};
const todayS=()=>fmt(new Date());
const toM=t=>{const [h,m]=t.split(':').map(Number);return h*60+m};
const fromM=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const nowM=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const uid=()=>Math.random().toString(36).slice(2,9);
const MON=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const WDL=['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const longDate=s=>{const d=parseD(s);return WDL[d.getDay()]+', '+d.getDate()+' '+MON[d.getMonth()]};
const shortDate=s=>{const d=parseD(s);return d.getDate()+' '+MON[d.getMonth()]};
const dueIn=s=>Math.round((parseD(s)-parseD(todayS()))/864e5);
function dueInfo(t){if(!t.due)return null;const n=dueIn(t.due);
  return {n,cls:n<0?'duecalm':n<=1?'warnchip':'duecalm',txt:n<0?'срок был '+shortDate(t.due):n===0?'срок сегодня':n===1?'срок завтра':'до '+shortDate(t.due)+' · '+n+' дн.'}}
const dueChip=t=>{const i=!t.done&&dueInfo(t);return i?`<span class="chip ${i.cls}">⚑ ${i.txt}</span>`:''};
const TK=a=>a.map(([l,t])=>`<button class="qc" data-act="tok" data-t="${t}">${l}</button>`).join('');

function parseQuick(raw){

    .replace(/через\s+недел[а-яё]*/i,()=>{ovD=addDays(todayS(),7);return ' '})
    .replace(/на\s+следующ[а-яё]+\s+недел[а-яё]*/i,()=>{ovD=addDays(todayS(),7-(parseD(todayS()).getDay()+6)%7);return ' '})
    .replace(/(?:на|в)\s+выходн[а-яё]*/i,()=>{const c=parseD(todayS()).getDay();ovD=addDays(todayS(),c===0?0:(6-c)%7);return ' '})
    .replace(/через\s+(\d+)\s*(?:час[а-яё]*|ч)(?=\s|$|,)/i,(m,n)=>{const t=Math.ceil((nowM()+ +n*60)/5)*5;if(t<1440){ovT=fromM(t);ovD=todayS()}return ' '})

      const now=new Date();let y=now.getFullYear();let d=new Date(y,+m[2]-1,+m[1]);
      if(fmt(d)<todayS())d=new Date(y+1,+m[2]-1,+m[1]);out.date=fmt(d);used[i]=true;continue}

function overlapIds(d){
  const t=dayTasks(d).filter(x=>x.time&&!x.done).sort(byTime),ids=new Set();
  for(let i=0;i<t.length-1;i++){if(toM(t[i].time)+t[i].dur>toM(t[i+1].time)){ids.add(t[i].id);ids.add(t[i+1].id)}}

function resolveOverlaps(day,keepIds){
  const isToday=day===todayS();
  const start=Math.max(toM(S.day.from),isToday?Math.ceil(nowM()/5)*5:0),end=Math.min(toM(S.day.to),22*60+30);
  const timed=dayTasks(day).filter(t=>t.time&&!t.done);
  const snap=timed.map(t=>({id:t.id,time:t.time}));
  // кто остаётся на месте: важные раньше, при равной важности тот, что начинается раньше
  const order=[...timed].sort((a,b)=>(b.prio-a.prio)||byTime(a,b));
  let kept=[],moving=[];
  if(keepIds){const ov=overlapIds(day);kept=timed.filter(t=>!ov.has(t.id)||keepIds.has(t.id));moving=timed.filter(t=>ov.has(t.id)&&!keepIds.has(t.id))}
  else for(const t of order){
    const a=toM(t.time),b=a+t.dur;
    if(kept.some(k=>a<toM(k.time)+k.dur&&toM(k.time)<b))moving.push(t);else kept.push(t);
  }
  if(!moving.length)return {moved:0,left:0,snap};
  const busy=kept.map(t=>[toM(t.time),toM(t.time)+t.dur+padFor(t)]);
  schBlocks(day).forEach(x=>busy.push([x.a,x.b]));
  moving.sort((a,b)=>(b.prio-a.prio)||byTime(a,b));
  let moved=0,left=0;
  for(const t of moving){
    const orig=toM(t.time);
    busy.sort((a,b)=>a[0]-b[0]);
    // свободные окна между занятыми кусками (после занятого оставляю 10 минут)
    const gaps=[];let c=start;
    for(const [a,b] of busy){if(a-c>=t.dur)gaps.push([c,a]);c=Math.max(c,b+10)}
    if(end-c>=t.dur)gaps.push([c,end]);
    // выбираю окно, ближайшее к исходному времени
    let best=null,bd=1e9;
    for(const [ga,gb] of gaps){
      let s=Math.min(Math.max(orig,ga),gb-t.dur);
      s=Math.min(gb-t.dur,Math.ceil(s/5)*5);if(s<ga)s=ga;
      const d=Math.abs(s-orig);if(d<bd){bd=d;best=s}
    }
    if(best===null){t.time=null;left++}
    else{t.time=fromM(best);busy.push([best,best+t.dur+padFor(t)]);moved++}
  }
  save();
  return {moved,left,snap};
}

function planHw(h){
  S.tasks=S.tasks.filter(t=>!(t.hwId===h.id&&!t.done));
  let need=Math.max(0,h.min-S.tasks.filter(t=>t.hwId===h.id&&t.done).reduce((x,t)=>x+t.dur,0));
  const today=todayS(),days=[];
  const last=h.due>today?addDays(h.due,-1):today;
  for(let d=today;d<=last&&days.length<60;d=addDays(d,1))days.push(d);
  if(!days.length)days.push(today);
  const parts=Math.max(1,Math.ceil(need/60)),base=Math.ceil(need/parts/5)*5,sizes=[];
  while(need>0){const s=Math.min(base,need);sizes.push(s);need-=s}
  const used=new Set(),made=[];let left=0;
  sizes.forEach((sz,k)=>{
    const tg=Math.min(days.length-1,Math.floor(k*days.length/sizes.length)),order=[];
    for(let i=tg;i<days.length;i++)order.push(days[i]);for(let i=tg-1;i>=0;i--)order.push(days[i]);
    const tries=[order.filter(d=>!used.has(d)&&!S.heavy[d]),order.filter(d=>!used.has(d)),order];
    let ok=false;
    for(const list of tries){
      for(const d of list){
        const w=freeInfo(d).windows.find(w=>Math.min(w[1],22*60+30)-w[0]>=sz);
        if(w){const t={id:uid(),title:'',cat:'study',date:d,time:fromM(w[0]),dur:sz,prio:dueIn(h.due)<=2?3:2,done:false,due:h.due,hwId:h.id};
          S.tasks.push(t);made.push(t);used.add(d);ok=true;break}
      }
      if(ok)break;
    }
    if(!ok)left+=sz;
  });
  made.sort((a,b)=>(a.date+a.time)<(b.date+b.time)?-1:1).forEach((t,i)=>{
    t.title='Домашка: '+h.subj+(h.title?' — '+h.title:'')+(made.length>1?' ('+(i+1)+'/'+made.length+')':'')});
  save();
  return {parts:made.length,placed:made.reduce((x,t)=>x+t.dur,0),left};
}

const SCP='На изображении расписание занятий студента. Верни только JSON такого вида: {"days":{"1":{"lessons":[{"a":"09:00","b":"10:30","t":"Математика","r":"215"},{"a":"10:40","b":"12:10","t":"История","r":""}]}},"note":""}. Ключи дней: 1 понедельник, 2 вторник, 3 среда, 4 четверг, 5 пятница, 6 суббота, 0 воскресенье; дни без занятий не включай. Каждая пара отдельным объектом: a начало, b конец, формат ЧЧ:ММ в 24 часа; t название предмета (коротко, можно с пометкой лекция или семинар); r аудитория, если указана, иначе пустая строка. Если указаны только номера пар, а на картинке есть звонковая сетка, используй её. Если расписание на две недели (числитель и знаменатель), возьми первую неделю и напиши об этом в note. Если разобрать не удалось, верни {"days":{},"note":"причина"}. Без пояснений и без markdown.';
function normSc(r){const o={},ok=t=>/^\d{1,2}:\d{2}$/.test(t||''),fx=t=>fromM(toM(t));

    let from=null,to=null;

function navSheet(on){
  const o=$('#navsheet');if(o)o.remove();if(!on)return;
  const d=document.createElement('div');d.id='navsheet';d.className='navsheet';
  d.innerHTML='<div class="navsheet-p" role="menu">'+VIEWS.filter(([k])=>!NAV_PRI.includes(k)).map(([k,n])=>`<button role="menuitem" data-act="nav" data-v="${k}" ${view===k?'aria-current="page"':''}>${IC[k]}<span>${n}</span></button>`).join('')+'</div>';
  d.addEventListener('click',e=>{if(e.target===d)navSheet(false)});

function renderNav(){
  navSheet(false);
  const hid=!NAV_PRI.includes(view),cur=VIEWS.find(v=>v[0]===view);
  $('#nav').innerHTML='<div class="brand"><i></i>Мой ритм</div>'+VIEWS.map(([k,n])=>`<button class="${NAV_PRI.includes(k)?'':'nx'}" data-act="nav" data-v="${k}" ${view===k?'aria-current="page"':''}>${IC[k]}<span>${n}</span></button>`).join('')+`<button class="nm" data-act="navmore" aria-label="Ещё разделы" ${hid?'aria-current="page"':''}>${hid&&cur?IC[view]:IC.more}<span>${hid&&cur?cur[1]:'Ещё'}</span></button><div class="sp"></div>`;

/* ---------- конференции: посты, чтобы не забыть ---------- */
const CF={tab:'act',edit:null,dr:{},busy:false,msg:'',key:false,open:null,ib:null,ie:'',key2:false,hint:'',ho:false};
const cfPassed=c=>c.dl?dueIn(c.dl)<0:(c.d?dueIn(c.d)<0:false);
const cfGroup=c=>c.st==='sent'?'sent':(cfPassed(c)?'old':'act');
const cfWhen=s=>{const d=parseD(s),y=new Date().getFullYear();return d.getDate()+' '+MON[d.getMonth()]+(d.getFullYear()!==y?' '+d.getFullYear():'')};
const cfLeft=n=>n<0?'срок прошёл':n===0?'сегодня':n===1?'завтра':'через '+n+' дн.';
function cfUrl(u){u=(u||'').trim();if(!u)return '';return /^https?:\/\//i.test(u)?u:'https://'+u.replace(/^\/+/,'')}
function cfSort(a,b){const k=c=>c.dl||c.d||'9999-12-31';return k(a)<k(b)?-1:k(a)>k(b)?1:0}
function confBanner(){
  const u=(S.conf||[]).filter(c=>c.dl&&c.st!=='sent'&&dueIn(c.dl)>=0&&dueIn(c.dl)<=3).sort(cfSort).slice(0,3);
  return u.length?'<div class="banner"><span>Конференции, срок подачи: '+u.map(c=>esc(c.t)+' ('+cfLeft(dueIn(c.dl))+')').join('; ')+'</span><button class="btn sm ghost" data-act="nav" data-v="conf">Открыть</button></div>':'';
}
function cfCard(c){
  const gr=cfGroup(c),n=c.dl?dueIn(c.dl):null,lk=cfUrl(c.l),ch=[];
  if(c.dl)ch.push('<span class="chip '+(gr==='sent'?'duecalm':n<0?'duebad':n<=3?'warnchip':'duecalm')+'">⚑ заявки до '+cfWhen(c.dl)+(gr==='act'?' · '+cfLeft(n):'')+'</span>');
  if(c.d)ch.push('<span class="chip">конференция '+cfWhen(c.d)+'</span>');
  if(c.w)ch.push('<span class="chip">'+esc(c.w)+'</span>');
  if(gr==='sent')ch.push('<span class="chip" style="color:var(--good)">заявка подана</span>');
  return '<div class="cfc fade"><div style="font-weight:700;font-size:16px">'+esc(c.t||'Без названия')+'</div>'+
    (c.s?'<div style="font-size:13px;color:var(--accent);font-weight:600">'+esc(c.s)+'</div>':'')+
    (c.topic?'<div class="cft">Моя тема: <b>'+esc(c.topic)+'</b></div>':'')+
    (ch.length?'<div class="cfm">'+ch.join('')+'</div>':'')+
    (c.p?'<details><summary>Текст поста</summary><div class="cfp">'+esc(c.p)+'</div></details>':'')+
    '<div class="cfb">'+
    '<button class="btn sm" data-cf="sent" data-id="'+c.id+'">'+(c.st==='sent'?'Вернуть в актуальные':'Подала заявку')+'</button>'+
    '<button class="btn sm ghost" data-cf="ideas" data-id="'+c.id+'" aria-expanded="'+(CF.open===c.id)+'">💡 Идеи тем</button>'+
    (lk?'<a class="btn sm ghost" href="'+esc(lk)+'" target="_blank" rel="noopener noreferrer">Открыть пост</a>':'')+
    '<button class="btn sm ghost" data-cf="edit" data-id="'+c.id+'">Изменить</button>'+
    '<button class="btn sm ghost" data-cf="del" data-id="'+c.id+'">Удалить</button></div>'+(CF.open===c.id?cfPanel(c):'')+'</div>';
}
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='cf-hd'){CF.ho=e.target.open;const sm=e.target.querySelector('summary'),h=(CF.hint||'').trim();if(sm)sm.textContent='О чём хочешь писать'+(h?': '+(h.length>40?h.slice(0,40)+'…':h):' (по желанию)')}},true);
function cfSync(){['t','p','l','dl','d','w','s'].forEach(k=>{const f=$('#cf-'+k);if(f)CF.dr[k]=f.value})}
async function cfAI(auto){
  if(CF.busy)return;
  cfSync();const txt=(CF.dr.p||'').trim();
  if(txt.length<30){if(!auto)toast('Сначала вставь текст поста');return}
  CF.busy=true;CF.msg='';CF.key=false;render();
  const pr='Ты помощник студента-исследователя. Ниже пост с анонсом конференции. Извлеки данные. Сегодня '+todayS()+'. Даты верни как ГГГГ-ММ-ДД; если год не указан, возьми ближайшую будущую дату. «deadline» это последний срок подачи заявки на участие, тезисов или статьи (если сроков несколько, возьми срок подачи заявки). «date» это дата начала конференции. Ничего не выдумывай: если данных нет, верни пустую строку. Пост: \"\"\"'+txt.slice(0,8000)+'\"\"\" Верни только JSON: {\"title\":\"название конференции, коротко\",\"deadline\":\"\",\"date\":\"\",\"subjects\":\"2-4 предмета или направления через запятую, коротко, например: право, философия\",\"place\":\"формат и место, коротко, например: Онлайн или Волгоград, очно\",\"link\":\"ссылка из текста, если есть\"}. Без markdown.';
  try{
    const r=await aiJ(pr)||{};
    const okD=s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')&&!isNaN(parseD(s).getTime());
    const put=(k,v)=>{v=String(v||'').trim();if(v&&(!auto||!CF.dr[k]))CF.dr[k]=v};
    put('t',String(r.title||'').slice(0,120));
    if(okD(r.deadline))put('dl',r.deadline);
    if(okD(r.date))put('d',r.date);
    put('s',String(r.subjects||'').slice(0,100));put('w',String(r.place||'').slice(0,80));
    put('l',r.link);
    CF.msg=(r.title||okD(r.deadline)||okD(r.date))?'Заполнила поля. Проверь даты и сохрани.':'Не нашла в тексте названия и дат, заполни вручную.';
  }catch(e){
    const m=aiErr(e);
    if(m==='nokey'){CF.key=true;CF.msg='Чтобы ИИ разбирал посты, нужен ключ.'}else CF.msg=m;
  }
  CF.busy=false;render();
}
document.addEventListener('paste',e=>{if(e.target&&e.target.id==='cf-p')setTimeout(()=>cfAI(true),80)});
function cfPanel(c){
  const id=c.id,busy=CF.ib===id,L=c.ideas||[];
  return '<div class="cfi"><details id="cf-hd"'+(CF.ho?' open':'')+'><summary>О чём хочешь писать'+(CF.hint?': '+esc(CF.hint.length>40?CF.hint.slice(0,40)+'…':CF.hint):' (по желанию)')+'</summary><label style="margin-top:8px"><input type="text" id="cf-hint" value="'+esc(CF.hint||'')+'" placeholder="Например: цифровизация права, Кант" aria-label="О чём хочешь писать"></label></details>'+
    '<div class="row"><button type="button" class="btn sm primary" data-cf="gen" data-id="'+id+'"'+(CF.ib?' disabled':'')+'>'+(busy?'Придумываю…':L.length?'Ещё идеи':'Придумать названия')+'</button></div>'+
    (CF.ie?'<div class="muted" style="font-size:13px" role="status">'+esc(CF.ie)+'</div>':'')+
    (CF.key2?'<div class="stack" style="gap:8px"><div class="muted" style="font-size:13px">Нужен бесплатный ключ Google Gemini: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Ключ хранится только в этом браузере.</div><input type="password" id="cf-pkey" autocomplete="off" placeholder="AIza…"><button type="button" class="btn sm primary" data-cf="pkey" data-id="'+id+'">Сохранить ключ и продолжить</button></div>':'')+
    L.map((x,i)=>'<div class="cfidea"><span>'+esc(x)+'</span><button type="button" class="btn sm'+(c.topic===x?'':' ghost')+'" data-cf="take" data-id="'+id+'" data-i="'+i+'">'+(c.topic===x?'✓ Выбрана':'Взять')+'</button></div>').join('')+'</div>';
}
async function cfIdeas(id){
  const c=(S.conf||[]).find(x=>x.id===id);if(!c||CF.ib)return;
  cfSync();CF.ib=id;CF.ie='';CF.key2=false;render();
  const old=c.ideas||[];
  const pr='Ты помогаешь студентке придумать тему доклада или статьи для научной конференции. Конференция: «'+(c.t||'')+'». Предметы и темы: '+(c.s||'не указаны')+'. Формат: '+(c.w||'не указан')+'. Текст анонса: \"\"\"'+(c.p||'').slice(0,3000)+'\"\"\" Область или мысль студентки: '+(CF.hint||'не указана')+'. Предложи 6 названий тем: академичные, конкретные, по 8-16 слов, с разными ракурсами, подходящие под тематику конференции. Не придумывай факты о конференции. '+(old.length?'Не повторяй уже предложенные: '+old.slice(0,12).join('; ')+'. ':'')+'Верни только JSON: {\"ideas\":[\"название темы\"]}. Без markdown.';
  try{
    const r=await aiJ(pr)||{};
    const n=arr(r.ideas,8).map(s=>s.replace(/^[\"«]+|[\"»]+$/g,'').trim()).filter(Boolean);
    if(!n.length)throw {code:'empty'};
    let L=n.concat(old.filter(x=>n.indexOf(x)<0)).slice(0,12);
    if(c.topic&&L.indexOf(c.topic)<0)L[L.length-1]=c.topic;
    c.ideas=L;save();
  }catch(e){const m=aiErr(e);if(m==='nokey'){CF.key2=true;CF.ie='Чтобы ИИ придумывал названия, нужен ключ.'}else CF.ie=m}
  CF.ib=null;render();
}
function vConf(){
  if(!S.conf)S.conf=[];
  const g={act:[],sent:[],old:[]};S.conf.forEach(c=>g[cfGroup(c)].push(c));
  Object.keys(g).forEach(k=>g[k].sort(cfSort));
  const ed=CF.edit&&S.conf.find(c=>c.id===CF.edit),v=CF.dr||{};
  const tabs=[['act','Актуальные'],['sent','Подала'],['old','Прошли']];
  const empty={act:'Пока пусто. Сохрани первый пост выше, и он появится здесь.',sent:'Здесь будут конференции, на которые ты уже подала заявку.',old:'Сюда попадают конференции, у которых срок уже прошёл.'}[CF.tab];
  return '<div class="head"><div><div class="eyebrow">Конференции</div><h1>Не пропустить конференцию</h1><p>Сохраняй посты с конференциями: срок подачи, дата и ссылка всегда под рукой. За три дня до срока напомню на главной.</p></div></div>'+
  '<div class="stack"><section class="card"><div class="row"><h3 class="grow" style="font-size:16px">'+(ed?'Правка поста':'Новый пост')+'</h3></div>'+
  '<div class="stack" style="gap:10px;margin-top:10px">'+
  '<label>Название конференции<input type="text" id="cf-t" value="'+esc(v.t||'')+'" placeholder="Например, Правовая наука 2027"></label>'+
  '<label>Текст поста<textarea id="cf-p" placeholder="Вставь пост целиком: название, даты, формат и ссылку ИИ найдёт сам">'+esc(v.p||'')+'</textarea></label>'+
  '<div class="row" style="gap:8px"><button type="button" class="btn sm" data-cf="ai"'+(CF.busy?' disabled':'')+'>✨ Разобрать пост с ИИ</button><span class="muted" style="font-size:13px" role="status">'+(CF.busy?'Читаю пост…':CF.msg?esc(CF.msg):'Сработает сам, когда вставишь текст')+'</span></div>'+
  (CF.key?'<div class="stack" style="gap:8px"><div class="muted" style="font-size:13px">Нужен бесплатный ключ Google Gemini: <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>. Ключ хранится только в этом браузере.</div><input type="password" id="cf-key" autocomplete="off" placeholder="AIza…"><button type="button" class="btn sm primary" data-cf="key">Сохранить ключ и разобрать</button></div>':'')+
  '<label>Ссылка на пост<input type="text" id="cf-l" value="'+esc(v.l||'')+'" placeholder="t.me/... или адрес сайта"></label>'+
  '<div class="grid2"><label>Срок подачи заявки<input type="date" id="cf-dl" value="'+esc(v.dl||'')+'"></label><label>Дата конференции<input type="date" id="cf-d" value="'+esc(v.d||'')+'"></label></div>'+
  '<label>Предметы и темы<input type="text" id="cf-s" value="'+esc(v.s||'')+'" placeholder="Например: право, философия, педагогика"></label>'+
  '<label>Формат или место<input type="text" id="cf-w" value="'+esc(v.w||'')+'" placeholder="Онлайн, очно, город"></label>'+
  '<div class="row" style="justify-content:flex-end">'+(ed?'<button class="btn" data-cf="cancel">Отмена</button>':'')+'<button class="btn primary" data-cf="save">'+(ed?'Сохранить изменения':'Сохранить пост')+'</button></div>'+
  '</div></section>'+
  '<div class="row" style="gap:8px">'+tabs.map(([k,n])=>'<button class="qc" data-cf="tab" data-v="'+k+'" aria-pressed="'+(CF.tab===k)+'" style="'+(CF.tab===k?'background:var(--soft);color:var(--accent)':'')+'">'+n+' · '+g[k].length+'</button>').join('')+'</div>'+
  '<div class="cfl">'+(g[CF.tab].map(cfCard).join('')||'<div class="card empty" style="grid-column:1/-1">'+empty+'</div>')+'</div></div>';
}
document.addEventListener('input',e=>{const i=e.target.id;if(i==='cf-hint'){CF.hint=e.target.value;return}if(i&&i.indexOf('cf-')===0&&i!=='cf-key'&&i!=='cf-pkey'&&CF.dr)CF.dr[i.slice(3)]=e.target.value});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-cf]');if(!el)return;
  const a=el.dataset.cf,id=el.dataset.id;if(!S.conf)S.conf=[];
  const c=id&&S.conf.find(x=>x.id===id);
  if(a==='tab'){cfSync();CF.tab=el.dataset.v;render()}
  else if(a==='ai')cfAI(false);
  else if(a==='ideas'&&c){cfSync();CF.open=CF.open===id?null:id;CF.ie='';CF.key2=false;render()}
  else if(a==='gen'&&c){const h=$('#cf-hint');if(h)CF.hint=h.value;cfIdeas(id)}
  else if(a==='take'&&c){const x=(c.ideas||[])[+el.dataset.i];if(x){c.topic=c.topic===x?'':x;save();cfSync();render()}}
  else if(a==='pkey'){const k=(($('#cf-pkey')||{}).value||'').trim();if(!k){toast('Вставь ключ');return}
    try{localStorage.setItem(AIK,JSON.stringify(Object.assign(aiCfg(),{key:k})))}catch(x){toast('Не удалось сохранить ключ в браузере');return}
    CF.key2=false;cfIdeas(id)}
  else if(a==='key'){const k=(($('#cf-key')||{}).value||'').trim();if(!k){toast('Вставь ключ');return}
    try{localStorage.setItem(AIK,JSON.stringify(Object.assign(aiCfg(),{key:k})))}catch(x){toast('Не удалось сохранить ключ в браузере');return}
    CF.key=false;cfAI(false)}
  else if(a==='save'){
    const gv=i=>(($('#cf-'+i)||{}).value||'').trim();
    const o={t:gv('t'),p:gv('p'),l:gv('l'),dl:gv('dl'),d:gv('d'),w:gv('w'),s:gv('s')};
    if(!o.t&&!o.p){toast('Напиши название или вставь текст поста');const f=$('#cf-t');if(f)f.focus();return}
    if(!o.t)o.t=o.p.split('\n')[0].slice(0,80);
    let it=CF.edit&&S.conf.find(x=>x.id===CF.edit);
    if(it){Object.assign(it,o);toast('Изменения сохранены')}
    else{it=Object.assign({id:uid(),st:'new',ts:Date.now()},o);S.conf.push(it);toast('Пост сохранён')}

  }

function gPaint(){const el=$('#game');if(el)el.innerHTML=gameHTML()}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-g]');if(!el)return;const a=el.dataset.g;

    else gPaint();
  }else{G.lock=true;gPaint();setTimeout(()=>{if(!G)return;f.open=c.open=false;G.lock=false;gPaint()},800)}
});

async function callAI(prompt,imgs){
  const c=aiCfg(),list=[(c.model||'').trim(),'gemini-3.5-flash-lite','gemini-2.5-flash-lite','gemini-flash-latest','gemini-2.5-flash','gemini-3.1-flash-lite'].filter((m,i,a)=>m&&a.indexOf(m)===i);
  let last={code:404},busy=null;
  for(let round=0;round<5;round++){
  busy=null;
  for(const model of list){
    let r;
    try{r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':c.key},body:JSON.stringify({contents:[{parts:[{text:prompt}].concat((imgs||[]).map(d=>({inline_data:{mime_type:'image/jpeg',data:d}})))}],generationConfig:{responseMimeType:'application/json',temperature:0.4}})})}
    catch(e){throw {code:'network'}}
    if(r.status===404){let m='';try{m=((await r.json()).error||{}).message||''}catch(e){}last={code:404,msg:m,model};continue}
    if(!r.ok){let m='';try{m=((await r.json()).error||{}).message||''}catch(e){}if(r.status===503||r.status===500||r.status===429){last=busy={code:r.status,msg:m};continue}throw {code:r.status,msg:m}}
    const j=await r.json(),t=(((j.candidates||[])[0]||{}).content||{}).parts;
    const txt=(t||[]).map(p=>p.text||'').join('').replace(/```json|```/g,'').trim();
    return JSON.parse(txt);
  }
  if(!busy)break;
  last=busy;
  await new Promise(r=>setTimeout(r,2500*(round+1)));
  }
  throw last;
}

  if(!el){el=document.createElement('div');el.id='apbar';el.className='card ask fade';el.style.cssText='top:calc(12px + env(safe-area-inset-top,0px));bottom:auto';document.body.appendChild(el)}
  el.innerHTML=`<div class="eyebrow">Анти-перфекционист</div><b>${esc(t?t.title:'')}</b><div class="ptime" id="aptime">${clock((AP.end-Date.now())/1e3)}</div><div class="muted" style="font-size:13px">Только финальное оформление. Время выйдет, и дело закроется.</div><div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="apdone">Готово раньше</button><button class="btn sm ghost" data-act="apx">Отмена</button></div>`}
function apTick(){if(!AP)return;const l=(AP.end-Date.now())/1e3;if(l<=0){const t=S.tasks.find(x=>x.id===AP.id);AP=null;apPaint();beep();if(t&&!t.done){flip(t,{target:document.body});toast('Время вышло, дело закрыто. Значит, этого достаточно.')}return}
  const a=$('#aptime');if(a)a.textContent=clock(l)}

  throw {code:'fmt'};
}

  if(a==='cust'){const k=+el.dataset.k,g=m.cust[k];if(!g)return;
    const idx=m.cells.findIndex((v,i)=>v&&!mrLocked(i)&&Math.floor(v/10)===g.c&&v%10===g.l);
    if(idx>=0){mrServe(idx,k);return}
    toast(g.a+' '+g.name+' просит: '+MR_CH[g.c].i[g.l-1]+' '+MR_CH[g.c].t[g.l-1]+'. Собери это на кухне')}
});

render();
if(!bat(todayS())&&S.batSkip!==todayS())openBat();
petTick();setInterval(petTick,1000);
})();
</script>
